<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopify CRM</title>
  <script>
    // Apply the saved colour mode before the app loads, so a dark page never flashes white.
    // Keep the key and rules in step with src/composables/useColorMode.ts. The merchant
    // board (/board/…) has its own theme and is left alone.
    (function () {
      try {
        if (location.pathname.indexOf('/board/') === 0) return;
        var mode = localStorage.getItem('crm_color_mode') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
